[project]
name = "bk-exp"
version = "0.1.0"
description = "Adaptive Brooklyn cultural tours powered by learning agents."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "daytona>=0.0.1",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "itsdangerous>=2.2.0",
    "pydantic-settings>=2.6.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
